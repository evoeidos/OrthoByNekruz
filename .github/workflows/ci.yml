name: CI

# Каждый push в main сразу деплоится на Timeweb — эта проверка ловит сломанную
# сборку, ошибки типов и утечку контента в публичный бандл.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit --incremental false

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Заглушки: модули API создают клиент Redis при импорте.
          # Клиент ленивый — при сборке к серверу не подключается.
          REDIS_HOST: 127.0.0.1
          BOT_TOKEN: ci-dummy

      - name: Check paid content is not in the client bundle
        run: npm run check:bundle
