<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Атлас позвонка</title>
  <link rel="stylesheet" href="atlas.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <h1>Атлас позвонка</h1>
        <p id="hint">Нажми латинское слово справа — откроется ракурс и точка на кости.</p>
      </div>
      <div class="actions" id="admin-actions" hidden>
        <button id="admin-btn" class="toggle">Admin Mode</button>
        <button id="copy-btn">Копировать конфиг</button>
        <button id="export-all-btn">Копировать все вкладки</button>
        <button id="reset-btn">Сбросить вкладку</button>
      </div>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <div class="main">
      <div class="stage-wrap">
        <div class="stage study" id="stage">
          <div class="photo-layer" id="photo-layer">
            <img id="photo" alt="Позвонок" />
            <div id="dots"></div>
          </div>
          <div class="admin-hint" id="admin-hint" hidden>клик = поставить · Alt+клик по точке = удалить</div>
        </div>
      </div>

      <aside class="side">
        <h2>Латынь</h2>
        <div class="terms" id="terms"></div>
      </aside>
    </div>

    <footer class="footer">
      <div class="caption">
        <div class="ru" id="caption-ru"></div>
        <div class="la" id="caption-la"></div>
      </div>
      <div class="caption" id="pending-wrap" hidden>
        <div class="ru" style="font-size:12px;color:var(--muted)">Следующий маркер</div>
        <div class="la" id="pending-term"></div>
      </div>
    </footer>
  </div>

  <div class="config" id="config">
    <pre id="config-pre"></pre>
  </div>

  <script src="atlas.js"></script>
</body>
</html>
